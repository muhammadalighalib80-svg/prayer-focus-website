        <main>
            <!-- 1. Introduction -->
            <section id="introduction">
                <h2 class="section-heading">
                    <span class="sec-num">1</span>
                    Introduction & Developer Identity
                </h2>
                <p>
                    This Privacy Policy governs the <strong>Prayer Focus</strong> Android mobile application (Package Identifier: <code>com.prayerfocus.app</code>), developed and maintained by the <strong>Prayer Focus Team</strong> ("we", "us", or "our").
                </p>
                <p>
                    We believe that worship, prayer, and personal focus require the highest level of dignity and privacy. This policy provides a comprehensive, transparent, and accurate disclosure of how Prayer Focus functions, what device features and permissions it utilizes, and how your privacy is protected. Every statement in this policy reflects what is actually implemented in the codebase.
                </p>
            </section>

            <!-- 2. Core Purpose -->
            <section id="core-mission">
                <h2 class="section-heading">
                    <span class="sec-num">2</span>
                    Core Purpose & Offline Operation
                </h2>
                <p>
                    The sole purpose of Prayer Focus is to assist Muslims in maintaining focus during the five daily prayers (Fajr, Zuhr, Asr, Maghrib, and Isha) by temporarily restricting access to user-selected distracting apps during designated 10-minute prayer windows.
                </p>
                <div class="callout">
                    <div class="callout-title">Verified Manifest Status: No Internet Permission</div>
                    <p>
                        Prayer Focus does not declare or request the <code>android.permission.INTERNET</code> permission in its Android Manifest. The application has no technical capability to communicate over the internet, make HTTP/HTTPS network requests, transmit device data, or upload files to any remote server.
                    </p>
                </div>
            </section>

            <!-- 3. Accessibility Service -->
            <section id="accessibility-service">
                <h2 class="section-heading">
                    <span class="sec-num">3</span>
                    Accessibility Service & App Restriction Policy
                </h2>
                <p>
                    Prayer Focus includes an Android Accessibility Service (<code>PrayerFocusAccessibilityService</code>). Google Play Developer Program Policies strictly regulate accessibility tools. Below are the precise technical details of our implementation:
                </p>

                <h3 class="sub-heading">A. Why the Accessibility Service is Needed</h3>
                <p>
                    Android's security architecture isolates applications into independent sandboxes. In order for Prayer Focus to fulfill its core function—preventing access to selected distracting apps while a prayer session is active—the system must recognize when one of those selected apps has been brought to the foreground by the user, so that Prayer Focus can display its peaceful pause and reminder screen.
                </p>

                <h3 class="sub-heading">B. Events and Data Accessed</h3>
                <ul>
                    <li><strong>Monitored Events:</strong> The service is registered exclusively for window state transitions (<code>AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED</code> and <code>TYPE_WINDOWS_CHANGED</code>).</li>
                    <li><strong>Information Accessed:</strong> The service reads only the package identifier string (such as <code>com.example.app</code>) of the active foreground window.</li>
                </ul>

                <h3 class="sub-heading">C. Explicit Technical Guarantees (What We Never Access)</h3>
                <div class="callout gold">
                    <div class="callout-title">canRetrieveWindowContent = false</div>
                    <p>
                        Our service configuration file explicitly specifies <code>android:canRetrieveWindowContent="false"</code>. This hardware-enforced Android restriction ensures Prayer Focus <strong>cannot inspect view hierarchies, read text on your screen, view form fields, monitor typing or keystrokes, capture login credentials or passwords, read chats or personal messages, or capture screenshots</strong>.
                    </p>
                </div>
                <ul>
                    <li><strong>No UI Automation:</strong> Prayer Focus does not perform automated clicks, gestures, text input, or interactions inside any third-party application.</li>
                    <li><strong>No Anti-Disabling Exploits:</strong> The service does not tamper with Android system settings or prevent users from turning off the service or uninstalling the app.</li>
                    <li><strong>Prominent In-App Disclosure:</strong> Before navigating the user to system settings, Prayer Focus presents a prominent disclosure dialog explaining the purpose and scope of the Accessibility Service.</li>
                </ul>

                <h3 class="sub-heading">D. How Selected-App Blocking Works</h3>
                <p>
                    When a prayer session begins, Prayer Focus enters an active focus state. If the Accessibility Service detects that an app brought to the foreground matches one of the package names you explicitly selected in your blocked apps list, Prayer Focus launches its own <code>FocusLockActivity</code> over the screen to gently remind you that your prayer focus window is in progress.
                </p>
                <p>
                    <strong>Safety Exclusions:</strong> Essential system apps are hardcoded as non-blockable. Prayer Focus will never block or restrict:
                </p>
                <ul>
                    <li>Emergency dialers and phone call services (<code>ACTION_DIAL</code>, <code>ACTION_EMERGENCY_DIAL</code>, Telecom default dialer)</li>
                    <li>Android System Settings (<code>com.android.settings</code>, <code>com.google.android.settings</code>)</li>
                    <li>System UI and Navigation (<code>com.android.systemui</code>)</li>
                    <li>Package Installer and Permission Controllers</li>
                    <li>Default Home Launchers and Personal Safety Hubs</li>
                </ul>

                <h3 class="sub-heading">E. Data Storage and Transmission</h3>
                <p>
                    Package names detected by the Accessibility Service are evaluated instantaneously in transient device RAM and are <strong>never written to persistent disk storage, never logged to permanent files, and never transmitted over any network</strong>.
                </p>
            </section>

            <!-- 4. App Selection -->
            <section id="app-selection">
                <h2 class="section-heading">
                    <span class="sec-num">4</span>
                    Installed-App Selection & Package Visibility
                </h2>
                <p>
                    In order for you to choose which applications to restrict during prayer times, Prayer Focus queries launchable user applications on your device using Android's standard <code>CATEGORY_LAUNCHER</code> intent filter.
                </p>
                <ul>
                    <li><strong>Narrow Package Queries:</strong> Prayer Focus complies with Google Play's Package Visibility policy by declaring targeted launcher queries in its manifest, rather than requesting broad unrestricted package scanning permissions (such as <code>QUERY_ALL_PACKAGES</code>).</li>
                    <li><strong>Local Selection Only:</strong> The list of installed apps is displayed only inside your local App Selector screen. Your chosen selections are saved as package identifier strings in your device's private preferences. Your installed app inventory is never exported or shared.</li>
                </ul>
            </section>

            <!-- 5. Prayer Timings -->
            <section id="prayer-timings">
                <h2 class="section-heading">
                    <span class="sec-num">5</span>
                    Prayer Timings, City Coordinates & Offline Engine
                </h2>
                <p>
                    Prayer Focus calculates Islamic prayer times 100% offline using the verified open-source <strong>Batoul Apps Adhan Library (v1.2.1)</strong>.
                </p>
                <div class="callout">
                    <div class="callout-title">Zero Location Tracking (No GPS Permission)</div>
                    <p>
                        Prayer Focus <strong>does not request or use</strong> <code>ACCESS_FINE_LOCATION</code> or <code>ACCESS_COARSE_LOCATION</code>. The app does not access your GPS, cell tower signals, Wi-Fi scans, or real-time physical device coordinates.
                    </p>
                </div>
                <p>
                    Instead, you choose your city manually from a predefined list of built-in regional geographic coordinates (such as Rawalpindi, Islamabad, Lahore, Karachi, Peshawar, Quetta, and Abbottabad). You may also customize your preferred Islamic calculation method (such as Karachi, Muslim World League, ISNA, Umm al-Qura, Egyptian) and Asr jurisprudential school (Hanafi or Shafi'i). All calculations occur purely through astronomical equations on your phone processor.
                </p>
            </section>

            <!-- 6. System Permissions -->
            <section id="permissions">
                <h2 class="section-heading">
                    <span class="sec-num">6</span>
                    System Permissions & Background Reliability
                </h2>
                <p>
                    Prayer Focus requests only the minimum set of permissions necessary to deliver timely prayer reminders and session management:
                </p>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Permission</th>
                                <th>Declared In Manifest</th>
                                <th>Purpose & Technical Scope</th>
                                <th>Data Destination</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><code>SCHEDULE_EXACT_ALARM</code></td>
                                <td>Yes (Android 12+)</td>
                                <td>Allows <code>AlarmManager</code> to fire precise alarms at calculated prayer times, even when the phone is in deep Doze power-saving state.</td>
                                <td><span class="badge local">Local OS Only</span></td>
                            </tr>
                            <tr>
                                <td><code>POST_NOTIFICATIONS</code></td>
                                <td>Yes (Android 13+)</td>
                                <td>Enables local visual status notifications when a 10-minute focus session starts. No remote push notifications.</td>
                                <td><span class="badge local">Local Screen Only</span></td>
                            </tr>
                            <tr>
                                <td><code>RECEIVE_BOOT_COMPLETED</code></td>
                                <td>Yes</td>
                                <td>Allows <code>BootReceiver</code> to safely reschedule upcoming prayer alarms when your phone reboots, and gracefully expire past sessions.</td>
                                <td><span class="badge local">Local OS Only</span></td>
                            </tr>
                            <tr>
                                <td><code>BIND_ACCESSIBILITY_SERVICE</code></td>
                                <td>Yes</td>
                                <td>Allows the service to detect foreground package names for restricted apps during an active session.</td>
                                <td><span class="badge local">Transient RAM Only</span></td>
                            </tr>

                <h3 class="sub-heading">Battery Optimization Settings</h3>
                <p>
                    Modern Android versions and custom manufacturer skins (such as Samsung One UI, Xiaomi HyperOS, Vivo Funtouch, and Oppo ColorOS) employ aggressive background task killers that can terminate alarm schedulers. Prayer Focus provides standard system guidance through Android's official <code>ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS</code> so you can choose to allow reliable background alarm triggering. Prayer Focus does not employ undocumented background exploits or battery bypasses.
                </p>

            <!-- 7. Local Storage -->
            <section id="storage">
                <h2 class="section-heading">
                    <span class="sec-num">7</span>
                    Local Storage & Data Retention
                </h2>
                <p>
                    All settings created or modified in Prayer Focus are saved locally in private app sandboxed storage via <strong>Android Jetpack DataStore (Preferences DataStore)</strong>.
                </p>
                <p><strong>Stored items include:</strong></p>
                <ul>
                    <li>Selected city identifier and calculation parameters (Method & Madhab)</li>
                    <li>User-configured prayer minute offsets and manual Jamaat times</li>
                    <li>Set of package names selected by the user for restriction</li>
                    <li>Session status flags and timestamps (to prevent repeating or overlapping sessions)</li>
                    <li>Automatic blocking toggle state (enabled/disabled/paused for today)</li>
                </ul>
                <p>
                    <strong>Data Retention:</strong> These preferences remain strictly inside the app's private sandbox on your device for as long as the application remains installed. They are never backed up to third-party tracking services or external clouds.
                </p>
            </section>

            <!-- 8. No Third Parties -->
            <section id="no-collection">
                <h2 class="section-heading">
                    <span class="sec-num">8</span>
                    Zero Third-Party Services, Ads, & Data Sharing
                </h2>
                <p>
                    We have verified the codebase dependencies and architecture against commercial data collection practices:
                </p>
                <ul>
                    <li><strong>No Advertising:</strong> Prayer Focus contains no advertising banners, interstitials, rewarded ads, or mobile advertising SDKs (such as Google AdMob, Unity, or AppLovin).</li>
                    <li><strong>No Analytics or Telemetry:</strong> Prayer Focus contains no analytics or tracking SDKs (such as Google Analytics for Firebase, Mixpanel, Segment, or Facebook SDK). We do not record user events, behavioral metrics, or screen viewing duration.</li>
                    <li><strong>No Crash Reporting Telemetry:</strong> Prayer Focus contains no external crash reporting tools (such as Firebase Crashlytics or Sentry). Crash logs are not gathered or transmitted.</li>
                    <li><strong>No Data Selling or Sharing:</strong> Because we collect zero personal data, we never sell, rent, monetize, broker, or disclose your information to any third party, government agency, or marketing organization.</li>
                </ul>
            </section>

            <!-- 9. User Control -->
            <section id="user-control">
                <h2 class="section-heading">
                    <span class="sec-num">9</span>
                    How Users Can Disable Permissions & Delete Data
                </h2>
                <p>
                    You retain complete, absolute control over all permissions, restricted apps, and stored data at all times:
                </p>

                <h3 class="sub-heading">A. Disabling or Revoking Permissions</h3>
                <ul>
                    <li><strong>Accessibility Service:</strong> Open your phone's <code>Settings &gt; Accessibility &gt; Downloaded Apps (or Installed Services) &gt; Prayer Focus</code> and switch the toggle to OFF.</li>
                    <li><strong>Exact Alarms:</strong> Open <code>Settings &gt; Apps &gt; Special App Access &gt; Alarms &amp; Reminders &gt; Prayer Focus</code> and disable the permission.</li>
                    <li><strong>Notifications:</strong> Open <code>Settings &gt; Apps &gt; Prayer Focus &gt; Notifications</code> and switch off notifications.</li>
                    <li><strong>Automatic Blocking:</strong> You can temporarily pause automatic focus for the day or disable automatic scheduling entirely with a single tap in the Prayer Focus dashboard.</li>
                </ul>

                <h3 class="sub-heading">B. Removing or Deleting Stored Data</h3>
                <ul>
                    <li><strong>In-App Unselection:</strong> You can deselect any restricted app at any time by opening the App Selector screen and unchecking it.</li>
                    <li><strong>Clearing App Data:</strong> You can wipe all preferences, city choices, and blocked app lists by going to your phone's <code>Settings &gt; Apps &gt; Prayer Focus &gt; Storage &gt; Clear Storage / Clear Data</code>.</li>
                    <li><strong>Uninstalling the App:</strong> Uninstalling Prayer Focus from your Android device immediately and permanently purges all local DataStore preferences from your device storage.</li>
                </ul>
            </section>
